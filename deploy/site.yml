---
- name: Deploy Favorite Things
  hosts: things.skinet.org
  become: true
  gather_facts: true
  any_errors_fatal: true

  pre_tasks:
    - name: Check required secrets
      ansible.builtin.assert:
        that:
          - favorite_things_db_password | length >= 16
          - favorite_things_db_password is match('^[A-Za-z0-9._~-]+$')
          - favorite_things_aws_access_key_id | length > 0
          - favorite_things_aws_secret_access_key | length > 0
          - favorite_things_aws_s3_bucket | length > 0
          - favorite_things_aws_s3_region | length > 0
          - favorite_things_letsencrypt_email | length > 0
          - >-
            (favorite_things_github_client_id | length > 0 and favorite_things_github_client_secret | length > 0) or
            (favorite_things_google_client_id | length > 0 and favorite_things_google_client_secret | length > 0)
        fail_msg: >-
          Fill in deploy/group_vars/all/vault.yml (copy vault.yml.example). The
          database password must be URL-safe (letters, digits, dot, underscore,
          tilde or hyphen) and at least 16 characters. AWS S3 credentials and
          bucket are required. At least one OAuth provider must be configured.

    - name: Check the target platform
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          This playbook targets Debian or Ubuntu. Adapt the apt tasks for
          another distribution before running it.

    - name: Determine the Go architecture
      ansible.builtin.set_fact:
        favorite_things_goarch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}"

    - name: Check the target architecture
      ansible.builtin.assert:
        that:
          - favorite_things_goarch | length > 0
        fail_msg: >-
          Unsupported architecture {{ ansible_architecture }}. Add it to the
          architecture map in site.yml.

    - name: Create the local build directory
      ansible.builtin.file:
        path: "{{ favorite_things_build_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Verify Go is installed on the controller
      ansible.builtin.command:
        cmd: go version
      delegate_to: localhost
      become: false
      changed_when: false
      register: go_version

    - name: Show Go version
      ansible.builtin.debug:
        msg: "{{ go_version.stdout }}"

    - name: Build the API binary for the target
      ansible.builtin.shell:
        cmd: |
          set -e
          cd "{{ playbook_dir }}/../backend"
          go build -trimpath -ldflags="-s -w" -o "{{ favorite_things_build_dir }}/favorite-things" ./cmd/server
          ls -la "{{ favorite_things_build_dir }}/favorite-things"
      environment:
        GOOS: linux
        GOARCH: "{{ favorite_things_goarch }}"
        CGO_ENABLED: "0"
      delegate_to: localhost
      become: false
      changed_when: true
      register: build_result

    - name: Show build output
      ansible.builtin.debug:
        msg: "{{ build_result.stdout_lines }}"

    - name: Install frontend dependencies
      ansible.builtin.command:
        cmd: npm ci --no-audit --no-fund
        chdir: "{{ playbook_dir }}/../frontend"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Build the frontend
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ playbook_dir }}/../frontend"
      delegate_to: localhost
      become: false
      changed_when: true

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: restarted
      listen: Restart PostgreSQL

    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Restart favorite-things
      ansible.builtin.systemd:
        name: favorite-things
        state: restarted
        daemon_reload: true
      listen: Restart favorite-things

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
          - nginx
          - certbot
          - curl
          - wget
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure PostgreSQL is running
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Ensure nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Create the system group
      ansible.builtin.group:
        name: "{{ favorite_things_group }}"
        system: true

    - name: Create the system user
      ansible.builtin.user:
        name: "{{ favorite_things_user }}"
        group: "{{ favorite_things_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ favorite_things_install_dir }}"
        create_home: false

    - name: Create the install, config and ACME directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ favorite_things_install_dir }}", owner: root, group: root, mode: "0755" }
        - { path: "{{ favorite_things_web_dir }}", owner: root, group: root, mode: "0755" }
        - { path: "{{ favorite_things_config_dir }}", owner: root, group: "{{ favorite_things_group }}", mode: "0750" }
        - { path: "{{ favorite_things_letsencrypt_webroot }}/.well-known/acme-challenge", owner: root, group: root, mode: "0755" }

    - name: Find PostgreSQL version
      ansible.builtin.shell:
        cmd: ls -d /etc/postgresql/*/main/ 2>/dev/null | head -1 | sed 's|/main||'
      register: pg_version
      changed_when: false
      failed_when: false

    - name: Set PostgreSQL config path
      ansible.builtin.set_fact:
        pg_hba_conf: "{{ pg_version.stdout }}/main/pg_hba.conf"
      when: pg_version.stdout | length > 0

    - name: Configure PostgreSQL to accept local password connections
      ansible.builtin.lineinfile:
        path: "{{ pg_hba_conf }}"
        regexp: '^local\s+all\s+all\s+peer'
        line: 'local   all             all                                     md5'
        state: present
      notify: Restart PostgreSQL
      when: pg_hba_conf is defined

    - name: Restart PostgreSQL for config changes
      ansible.builtin.systemd:
        name: postgresql
        state: restarted

    - name: Create or update the database role
      ansible.builtin.shell:
        cmd: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 << 'EOSQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ favorite_things_db_user }}') THEN
              CREATE ROLE {{ favorite_things_db_user }} WITH LOGIN PASSWORD '{{ favorite_things_db_password }}' NOSUPERUSER NOCREATEDB NOCREATEROLE;
            ELSE
              ALTER ROLE {{ favorite_things_db_user }} WITH LOGIN PASSWORD '{{ favorite_things_db_password }}' NOSUPERUSER NOCREATEDB NOCREATEROLE;
            END IF;
          END
          $$;
          EOSQL
      no_log: true
      changed_when: false

    - name: Check whether the database exists
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - "SELECT 1 FROM pg_database WHERE datname = '{{ favorite_things_db_name }}'"
      register: favorite_things_db_exists
      changed_when: false

    # CREATE DATABASE cannot run inside a DO block or transaction, so it has to
    # be a separate statement.
    - name: Create the database
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - createdb
          - -O
          - "{{ favorite_things_db_user }}"
          - "{{ favorite_things_db_name }}"
      when: favorite_things_db_exists.stdout | trim != "1"

    - name: Install the API binary
      ansible.builtin.copy:
        src: "{{ favorite_things_build_dir }}/favorite-things"
        dest: "{{ favorite_things_install_dir }}/favorite-things"
        owner: root
        group: root
        mode: "0755"
      notify: Restart favorite-things

    - name: Install the frontend
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../frontend/dist/"
        dest: "{{ favorite_things_web_dir }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      notify: Restart favorite-things

    - name: Install the environment file
      ansible.builtin.template:
        src: favorite-things.env.j2
        dest: "{{ favorite_things_config_dir }}/favorite-things.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart favorite-things

    - name: Install the systemd service for the API
      ansible.builtin.template:
        src: favorite-things.service.j2
        dest: /etc/systemd/system/favorite-things.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart favorite-things

    - name: Enable and start the favorite-things service
      ansible.builtin.systemd:
        name: favorite-things
        state: started
        enabled: true
        daemon_reload: true

    - name: Check for an existing TLS certificate
      ansible.builtin.stat:
        path: "{{ favorite_things_letsencrypt_cert }}"
      register: favorite_things_cert

    - name: Record whether TLS is already configured
      ansible.builtin.set_fact:
        favorite_things_has_cert: "{{ favorite_things_cert.stat.exists | bool }}"

    - name: Install the nginx site
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: /etc/nginx/sites-available/favorite-things.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable the nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/favorite-things.conf
        dest: /etc/nginx/sites-enabled/favorite-things.conf
        state: link
      notify: Reload nginx

    - name: Disable the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Reload nginx before the ACME challenge
      ansible.builtin.meta: flush_handlers

    - name: Obtain the TLS certificate
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - --webroot-path
          - "{{ favorite_things_letsencrypt_webroot }}"
          - --domains
          - "{{ favorite_things_domain }}"
          - --non-interactive
          - --agree-tos
          - --no-eff-email
          - --email
          - "{{ favorite_things_letsencrypt_email }}"
      when: not (favorite_things_has_cert | bool)
      changed_when: true

    - name: Update the TLS configuration flag
      ansible.builtin.set_fact:
        favorite_things_has_cert: true

    - name: Install the final nginx site
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: /etc/nginx/sites-available/favorite-things.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Ensure the certbot deploy hook directory exists
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Reload nginx when certificates renew
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          systemctl reload nginx

    - name: Find the certbot timer unit
      ansible.builtin.command:
        cmd: systemctl list-unit-files --type=timer certbot.timer
      register: favorite_things_certbot_timer
      changed_when: false
      failed_when: false

    - name: Ensure the certbot timer is enabled
      ansible.builtin.systemd:
        name: certbot.timer
        state: started
        enabled: true
      when: "'certbot.timer' in favorite_things_certbot_timer.stdout"

    - name: Apply pending service and nginx changes
      ansible.builtin.meta: flush_handlers

    - name: Verify the app started
      block:
        - name: Wait for the app to become healthy
          ansible.builtin.uri:
            url: "{{ favorite_things_healthcheck_url }}"
            status_code: 200
          register: favorite_things_health
          retries: 30
          delay: 2
          until: favorite_things_health.status == 200
          changed_when: false

        - name: Wait for the web interface to become available
          ansible.builtin.uri:
            url: "http://{{ favorite_things_listen_host }}:{{ favorite_things_listen_port }}/"
            status_code: 200
          register: favorite_things_web
          retries: 30
          delay: 2
          until: favorite_things_web.status == 200
          changed_when: false

      rescue:
        - name: Show the service status
          ansible.builtin.command:
            cmd: systemctl status favorite-things --no-pager
          changed_when: false
          failed_when: false

        - name: Show recent application logs
          ansible.builtin.command:
            cmd: journalctl -u favorite-things -n 80 --no-pager
          changed_when: false
          failed_when: false

        - name: Fail the deployment
          ansible.builtin.fail:
            msg: "Favorite Things did not become healthy. Check the service logs above."
